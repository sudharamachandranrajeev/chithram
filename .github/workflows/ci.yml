name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Torrent engine (cargo test, cargo deny)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/torrent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      - run: cargo test --release --locked -- --test-threads=1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: native/torrent/Cargo.toml
          command: check

  dart:
    name: Flutter app and packages (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      # The same library the release builds bundle; packages/torrent tests load it.
      - name: Torrent library (linux, for the FFI tests and bundling)
        run: |
          cargo build --release --locked --lib --manifest-path native/torrent/Cargo.toml
          mkdir -p packages/torrent/prebuilt/linux-x64
          cp native/torrent/target/release/libchithram_torrent.so packages/torrent/prebuilt/linux-x64/
      # TDLib's library (tdlib.yml), checked against the pinned sha256: packages/tdlib's
      # native test runs the real FFI path against it.
      - name: TDLib (linux)
        run: python3 packages/tdlib/tool/fetch_tdlib.py linux-x64
      # flutter_secure_storage on Linux (the keyring); the Linux builds need it too.
      - name: libsecret
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-dev >/dev/null
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # One pub workspace: a single resolution and a single pubspec.lock at the root.
      - run: flutter pub get
      # No Flutter on the dev machine, so the lockfile is resolved here. If it
      # is missing or out of date, it is printed and uploaded: commit it.
      - name: Lockfile status
        run: |
          git status --short pubspec.lock
          git diff -- pubspec.lock
          if [[ -n $(git status --porcelain pubspec.lock) ]]; then
            echo "::warning::pubspec.lock is missing or out of date (see the pubspec-lock artifact)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec-lock
          retention-days: 2
          path: pubspec.lock
      # Pure-Dart packages (no `sdk: flutter`) use dart analyze / dart test.
      - name: Analyze
        run: |
          for d in app packages/*/; do
            d=${d%/}
            [[ -f $d/pubspec.yaml ]] || continue
            echo "::group::analyze $d"
            if grep -q 'sdk: flutter' "$d/pubspec.yaml"; then
              (cd "$d" && flutter analyze --no-fatal-infos)
            else
              (cd "$d" && dart analyze)
            fi
            echo "::endgroup::"
          done
      - name: Test
        env:
          CHITHRAM_TORRENT_LIB: ${{ github.workspace }}/packages/torrent/prebuilt/linux-x64/libchithram_torrent.so
          CHITHRAM_TDLIB_LIB: ${{ github.workspace }}/packages/tdlib/prebuilt/linux-x64/libtdjson.so
        run: |
          for d in app packages/*/; do
            d=${d%/}
            [[ -f $d/pubspec.yaml ]] || continue
            [[ -d $d/test ]] || continue
            echo "::group::test $d"
            if grep -q 'sdk: flutter' "$d/pubspec.yaml"; then
              (cd "$d" && flutter test)
            else
              (cd "$d" && dart test)
            fi
            echo "::endgroup::"
          done
      # flutter test treats anything under integration_test/ as a device test,
      # so the host-run tests (focus, layout, form factors) are copied next to
      # the normal ones first.
      - name: Host widget tests (phone, TV and desktop shells)
        working-directory: app
        run: |
          mkdir test/_host
          cp integration_test/host_test.dart integration_test/host_form_test.dart integration_test/support.dart test/_host/
          flutter test test/_host
      - name: Fixture server tests (serve.py)
        run: python3 -m unittest discover -s packages/chithram_player/tool -p 'test_*.py'

  # The committed drift code (lib/src/data/*.g.dart), the schema dump and the
  # migration test helpers must be what the generators produce now.
  codegen:
    name: Generated code is fresh (build_runner, drift schema)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Regenerate
        working-directory: app
        run: |
          dart run build_runner build
          dart run drift_dev schema dump lib/src/data/database.dart drift_schemas/
          dart run drift_dev schema generate drift_schemas/ test/data/generated/
      - name: Compare with what is committed
        run: |
          git status --short -- app/lib app/drift_schemas app/test/data
          if [[ -n $(git status --porcelain -- app/lib app/drift_schemas app/test/data) ]]; then
            git diff -- app/lib app/drift_schemas app/test/data > codegen.diff
            echo "::error::generated code is stale: run build_runner, drift_dev schema dump and schema generate in app/ (see the codegen-diff artifact)"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: codegen-diff
          retention-days: 2
          path: codegen.diff
          if-no-files-found: ignore
