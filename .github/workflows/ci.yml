name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Torrent engine (cargo test, cargo deny)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/torrent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      - run: cargo test --release --locked -- --test-threads=1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: native/torrent/Cargo.toml
          command: check

  dart:
    name: Flutter app and packages (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      # The same library the release builds bundle; packages/torrent tests load it.
      - name: Torrent library (linux, for the FFI tests and bundling)
        run: |
          cargo build --release --locked --lib --manifest-path native/torrent/Cargo.toml
          mkdir -p packages/torrent/prebuilt/linux-x64
          cp native/torrent/target/release/libchithram_torrent.so packages/torrent/prebuilt/linux-x64/
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # One pub workspace: a single resolution and a single pubspec.lock at the root.
      - run: flutter pub get
      # No Flutter on the dev machine, so the lockfile is resolved here. If it
      # is missing or out of date, it is printed and uploaded: commit it.
      - name: Lockfile status
        run: |
          git status --short pubspec.lock
          git diff -- pubspec.lock
          if [[ -n $(git status --porcelain pubspec.lock) ]]; then
            echo "::warning::pubspec.lock is missing or out of date (see the pubspec-lock artifact)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec-lock
          path: pubspec.lock
      # Pure-Dart packages (no `sdk: flutter`) use dart analyze / dart test.
      - name: Analyze
        run: |
          for d in app packages/*/; do
            d=${d%/}
            [[ -f $d/pubspec.yaml ]] || continue
            echo "::group::analyze $d"
            if grep -q 'sdk: flutter' "$d/pubspec.yaml"; then
              (cd "$d" && flutter analyze --no-fatal-infos)
            else
              (cd "$d" && dart analyze --no-fatal-infos)
            fi
            echo "::endgroup::"
          done
      - name: Test
        env:
          CHITHRAM_TORRENT_LIB: ${{ github.workspace }}/packages/torrent/prebuilt/linux-x64/libchithram_torrent.so
        run: |
          for d in app packages/*/; do
            d=${d%/}
            [[ -f $d/pubspec.yaml ]] || continue
            [[ -d $d/test ]] || continue
            echo "::group::test $d"
            if grep -q 'sdk: flutter' "$d/pubspec.yaml"; then
              (cd "$d" && flutter test)
            else
              (cd "$d" && dart test)
            fi
            echo "::endgroup::"
          done
