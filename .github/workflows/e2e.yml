# End-to-end suite: integration_test/e2e_all_test.dart against ffmpeg fixtures,
# a local fixture server and a local torrent seeder (see .github/e2e.sh). No
# real network. Linux runs under Xvfb; the TV job boots an Android TV emulator
# and the phone job a phone one (e2e_phone_test.dart, then phone-shots.sh).
name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - 'native/torrent/**'
      - '.github/e2e*'
      - '.github/fixtures/**'
      - '.github/phone-shots.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - 'native/torrent/**'
      - '.github/e2e*'
      - '.github/fixtures/**'
      - '.github/phone-shots.sh'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  linux-e2e:
    name: Linux under Xvfb
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build tools, Xvfb, Mesa and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev mpv xvfb libgl1-mesa-dri libegl1 libgles2 ffmpeg >/dev/null
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The same library the release builds bundle; the torrent tests load it.
      - name: Torrent library (linux)
        run: |
          cargo build --release --locked --lib --manifest-path native/torrent/Cargo.toml
          mkdir -p packages/torrent/prebuilt/linux-x64
          cp native/torrent/target/release/libchithram_torrent.so packages/torrent/prebuilt/linux-x64/
      - run: flutter pub get
      - name: TDLib (linux, pinned sha256)
        run: python3 packages/tdlib/tool/fetch_tdlib.py linux-x64
      # Search plugins run in the sandbox; the Linux suite uses the same runtime
      # the release builds bundle (python-build-standalone, nova-sandbox).
      - name: Plugin runtime (nova/)
        run: |
          bash .github/nova-runtime.sh linux "$RUNNER_TEMP/novart"
          n=$RUNNER_TEMP/novart/nova
          {
            echo "NOVA_PYTHON=$n/python/bin/python3"
            echo "NOVA_PY_PREFIX=$n/python"
            echo "NOVA_RUNNER_DIR=$n/runtime"
            echo "NOVA_SANDBOX=$n/nova-sandbox"
          } >> "$GITHUB_ENV"
      - name: Fixtures, servers and seeder
        run: bash .github/e2e.sh host-services "$RUNNER_TEMP/e2e"
      - name: End-to-end suite
        working-directory: app
        env:
          CHITHRAM_MPV_AO: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mapfile -t defines <"$RUNNER_TEMP/e2e/e2e.env"
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 900 \
            flutter test integration_test/e2e_all_test.dart -d linux "${defines[@]}" --dart-define=E2E_FORM=desktop 2>&1 | tee ../linux-e2e.log
      - name: Results to the step summary
        if: always()
        run: |
          { echo '### Linux e2e'; echo '```'; grep -E 'CHITHRAM_E2E|\+[0-9]|All tests passed|Some tests failed|Error|timeout' linux-e2e.log 2>/dev/null | tail -30 || echo 'no log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true  # the repo's Actions artifact quota may be full
        with:
          name: e2e-linux
          retention-days: 2
          path: |
            linux-e2e.log
            ${{ runner.temp }}/e2e/serve.log
            ${{ runner.temp }}/e2e/seeder.log
          if-no-files-found: ignore

  tv-e2e:
    name: Android TV emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Free disk space (the TV image does not fit otherwise)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          sudo apt-get clean || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      - run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache system image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sysimg-system-images;android-36;android-tv;x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the emulator and run the suite
        run: bash .github/e2e.sh android e2e-out
      - name: Results to the step summary
        if: always()
        run: |
          {
            echo '### TV e2e (system-images;android-36;android-tv;x86_64)'
            echo '```'
            grep -E 'CHITHRAM_E2E|\+[0-9]+: |All tests passed|Some tests failed|\[E\]' e2e-out/drive.log 2>/dev/null | tail -30 || echo 'no drive log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: e2e-tv
          retention-days: 2
          path: |
            e2e-out
            !e2e-out/fixtures/**/*.mp4
            !e2e-out/fixtures/**/*.mkv
            !e2e-out/fixtures/**/*.m4a
            !e2e-out/fixtures/**/*.ts
            !e2e-out/fixtures/seed
            !e2e-out/fixtures/t
          if-no-files-found: ignore

  phone-e2e:
    name: Android phone emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free disk space (the TV image does not fit otherwise)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          sudo apt-get clean || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android,aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      - run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache system image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sysimg-system-images;android-36;google_apis;x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A Pixel 6 AVD at 1264x2780 @ 480 dpi (421x927 dp, the owner's phone), soft
      # keyboard on. After the suite: a debug APK (arm64 + x86_64) and phone-shots.sh.
      - name: Boot the emulator and run the suite
        env:
          IMAGE: 'system-images;android-36;google_apis;x86_64'
          DEVICE: pixel_6
          E2E_TARGET: e2e_phone_test.dart
          E2E_FORM: phone
          AVD_LCD: 1264x2780@480
          AVD_KEYBOARD: 'no'
          PHONE_SHOTS: '1'
          # One player open, so only the cold one (codec loading) is measured.
          FIRST_FRAME_MAX_MS: '12000'
        run: bash .github/e2e.sh android phone-out
      - name: Results to the step summary
        if: always()
        run: |
          {
            echo '### Phone e2e (system-images;android-36;google_apis;x86_64)'
            echo '```'
            grep -E 'CHITHRAM_E2E|\+[0-9]+: |All tests passed|Some tests failed|\[E\]' phone-out/drive.log 2>/dev/null | tail -30 || echo 'no drive log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: e2e-phone
          retention-days: 2
          path: |
            phone-out
            !phone-out/apk
            !phone-out/fixtures/**/*.mp4
            !phone-out/fixtures/**/*.mkv
            !phone-out/fixtures/**/*.m4a
            !phone-out/fixtures/**/*.ts
            !phone-out/fixtures/seed
            !phone-out/fixtures/t
          if-no-files-found: ignore
      # For phone-shots.sh on a real phone: gh run download <run> -n phone-debug-apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: phone-debug-apk
          retention-days: 2
          path: phone-out/apk/chithram-debug.apk
          if-no-files-found: ignore
