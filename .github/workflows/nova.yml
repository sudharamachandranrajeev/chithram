# The search-plugin runtime: runner unit tests, the sandbox acceptance suite on
# Linux and Windows (three Pythons), the host operations (describe, pinned
# allowlist, url-changed, download), and the same suite inside the Android TV
# emulator's isolated-process service.
name: Nova

on:
  push:
    branches: [main]
    paths: &paths
      - "packages/nova_host/**"
      - "native/sandbox/**"
      - "python/nova/**"
      - "app/lib/src/smoke.dart"
      - "app/lib/src/plugins/plugin_runtime.dart"
      - "app/android/settings.gradle.kts"
      - ".github/nova-runtime.sh"
      - ".github/workflows/nova.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # python-build-standalone release 20261013, install_only_stripped, pinned by sha256
  # (from the release's SHA256SUMS).
  PBS_RELEASE: "20261013"
  PBS_LINUX_FILE: cpython-3.13.16+20261013-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
  PBS_LINUX_SHA256: d0080766b6b74aeb81e1949ef0d9a20e6c17f7b160fb295a69b936ccb17660be
  PBS_WINDOWS_FILE: cpython-3.13.16+20261013-x86_64-pc-windows-msvc-install_only_stripped.tar.gz
  PBS_WINDOWS_SHA256: 7aba3985d4cee1c7cacb963ca6aa08a5d3e695d7f9609d9fabc56f22ddcf5a06

jobs:
  desktop:
    name: ${{ matrix.os }} python ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, py: "3.11" }
          - { os: ubuntu-22.04, py: "3.13" }
          - { os: ubuntu-22.04, py: "pbs-3.13" }
          - { os: windows-latest, py: "3.11" }
          - { os: windows-latest, py: "3.13" }
          - { os: windows-latest, py: "pbs-3.13" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !startsWith(matrix.py, 'pbs') }}
        with:
          python-version: ${{ matrix.py }}

      - name: Fetch python-build-standalone 3.13 (pinned sha256)
        if: ${{ startsWith(matrix.py, 'pbs') }}
        run: |
          if [[ $RUNNER_OS == Windows ]]; then f=$PBS_WINDOWS_FILE; sha=$PBS_WINDOWS_SHA256; else f=$PBS_LINUX_FILE; sha=$PBS_LINUX_SHA256; fi
          mkdir -p "$RUNNER_TEMP/pbs"
          curl -fsSL -o "$RUNNER_TEMP/pbs.tgz" "https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_RELEASE/${f//+/%2B}"
          echo "$sha  $RUNNER_TEMP/pbs.tgz" | sha256sum -c -
          (cd "$RUNNER_TEMP/pbs" && tar -xzf ../pbs.tgz)
          if [[ $RUNNER_OS == Windows ]]; then PY="$RUNNER_TEMP/pbs/python/python.exe"; else PY="$RUNNER_TEMP/pbs/python/bin/python3"; fi
          echo "PY_CMD=$PY" >> "$GITHUB_ENV"

      - name: Resolve interpreter
        run: |
          PY=${PY_CMD:-python}
          "$PY" -c "import sys; print('NOVA_PYTHON=' + sys.executable); print('NOVA_PY_PREFIX=' + sys.base_prefix)" >> "$GITHUB_ENV"
          "$PY" --version
          here=$(pwd -W 2>/dev/null || pwd)
          echo "NOVA_RUNNER_DIR=$here/python/nova/runtime" >> "$GITHUB_ENV"
          if [[ $RUNNER_OS == Windows ]]; then ext=.exe; else ext=; fi
          echo "NOVA_SANDBOX=$here/native/sandbox/target/release/nova-sandbox$ext" >> "$GITHUB_ENV"

      - name: Python runner unit tests and generated fixtures
        run: |
          "${PY_CMD:-python}" -I -W ignore -m unittest discover -s python/nova/dev/tests -v
          python3 python/nova/dev/tools/gen_fixtures_dart.py --check || python python/nova/dev/tools/gen_fixtures_dart.py --check

      - name: Build the sandbox launcher
        run: |
          cargo build --release --locked --manifest-path native/sandbox/Cargo.toml
          ls -la native/sandbox/target/release/ | head
          echo "::group::Cargo.lock (commit this)"
          base64 -w0 native/sandbox/Cargo.lock 2>/dev/null || base64 native/sandbox/Cargo.lock
          echo
          echo "::endgroup::"

      - name: Sandbox smoke
        run: |
          "$NOVA_SANDBOX" --ro "$NOVA_PY_PREFIX" --ro "$NOVA_RUNNER_DIR" --cwd "$NOVA_RUNNER_DIR" -- "$NOVA_PYTHON" -I -c "import sys; print('python inside sandbox', sys.version.split()[0])"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Real minisign cross-check files (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          d=$RUNNER_TEMP/realms; mkdir -p "$d"
          curl -fsSL -o "$d/ms.tgz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $d/ms.tgz" | sha256sum -c -
          tar -xzf "$d/ms.tgz" -C "$d" minisign-linux/x86_64/minisign
          ms=$d/minisign-linux/x86_64/minisign
          "$ms" -G -W -f -p "$d/k.pub" -s "$d/k.key"
          printf 'real minisign test file\n' > "$d/f"
          "$ms" -S -s "$d/k.key" -m "$d/f" -x "$d/f.minisig" -t "chithram test" < /dev/null
          echo "NOVA_REAL_MINISIGN_DIR=$d" >> "$GITHUB_ENV"

      - run: flutter pub get
      - name: Analyze
        run: |
          (cd packages/nova_host && flutter analyze --no-fatal-infos)
          (cd app && flutter analyze --no-fatal-infos)

      - name: Unit tests (crypto, repo, broker, SOCKS5, describe/pinning/download)
        working-directory: packages/nova_host
        run: flutter test --reporter expanded test/crypto_test.dart test/repo_test.dart test/broker_test.dart test/real_minisign_test.dart test/host_ops_test.dart

      - name: Acceptance, kernel/job layer plus audit hook
        working-directory: packages/nova_host
        env:
          NOVA_AUDIT: "1"
        run: |
          export NOVA_SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          echo "### ${{ matrix.os }} python ${{ matrix.py }}" >> "$GITHUB_STEP_SUMMARY"
          flutter test --reporter expanded test/acceptance_test.dart

      - name: Plugin registry against the real sandbox (app tests)
        working-directory: app
        run: flutter test --reporter expanded test/plugins/real_runtime_test.dart

      - name: Acceptance, kernel/job layer ONLY (audit hook off)
        if: always()
        working-directory: packages/nova_host
        env:
          NOVA_AUDIT: "0"
        run: |
          export NOVA_SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          flutter test --reporter expanded test/acceptance_test.dart

  android:
    name: Android TV emulator (CPython, isolatedProcess)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/share/swift /usr/local/.ghcup || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK (x86_64)
        working-directory: app
        run: flutter build apk --debug --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the suite on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash packages/nova_host/tool/android_suite.sh app/build/app/outputs/flutter-apk/app-debug.apk nova-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: nova-android
          path: nova-android
          retention-days: 2

  apk-size:
    name: APK size vs main
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/share/swift /usr/local/.ghcup || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: branch
          fetch-depth: 0
      - name: Check out the merge-base with main (what this branch started from)
        run: |
          base=$(git -C branch merge-base origin/main HEAD)
          echo "merge-base: $base"
          git -C branch worktree add ../main "$base"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build release APKs (branch)
        run: |
          cd branch && flutter pub get && cd app
          flutter build apk --release --split-per-abi
          ls -l build/app/outputs/flutter-apk/
      - name: Build release APKs (main)
        run: |
          cd main && flutter pub get && cd app
          flutter build apk --release --split-per-abi
          ls -l build/app/outputs/flutter-apk/
      - name: Report
        run: |
          {
            echo "### APK size delta (release, split per ABI, debug-signed) branch vs main"
            echo
            echo "| ABI | merge-base | branch | delta |"
            echo "|---|---|---|---|"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              m=$(stat -c %s main/app/build/app/outputs/flutter-apk/app-$abi-release.apk)
              b=$(stat -c %s branch/app/build/app/outputs/flutter-apk/app-$abi-release.apk)
              echo "| $abi | $((m/1024)) KiB | $((b/1024)) KiB | +$(( (b-m)/1024 )) KiB |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
