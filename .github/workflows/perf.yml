# Performance on the Android TV emulator: cold start to Home ("Fully drawn"),
# scroll frames, memory (PSS), requests before the first frame. See
# .github/perf.sh. The budget (.github/perf-budget.json) starts in report mode:
# the job publishes numbers and does not fail on them. The emulator renders in
# software, so only the UI-thread build time is a gate later; raster time and the
# real targets are measured on devices with .github/perf-device.sh.
name: Perf

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - 'native/torrent/**'
      - '.github/perf*'
      - '.github/fixtures/**'
      - '.github/workflows/perf.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - 'native/torrent/**'
      - '.github/perf*'
      - '.github/fixtures/**'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  tv-perf:
    name: Android TV emulator (release, report mode)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Free disk space (the TV image does not fit otherwise)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          sudo apt-get clean || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/torrent
      - run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache system image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sysimg-system-images;android-36;android-tv;x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure
        run: bash .github/perf.sh perf-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true  # the repo's Actions artifact quota may be full
        with:
          name: perf-tv
          retention-days: 2
          path: |
            perf-out
            !perf-out/*.apk
            !perf-out/fixtures
          if-no-files-found: ignore
