# Spike: packages/chithram_player. Android TV emulator (Media3) and Linux/Xvfb
# (media_kit) play ffmpeg-generated fixtures served over a local http server.
# Emulator numbers are emulator-only: no HW decode, tunneling, AFR or HDR here.
name: Spike player

on:
  push:
    paths:
      - 'packages/chithram_player/**'
      - 'app/lib/src/spikes/player_page.dart'
      - 'app/integration_test/**'
      - '.github/workflows/spike-player.yml'
  workflow_dispatch:

concurrency:
  group: spike-player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android-emulator:
    name: Android TV emulator (Media3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build the debug APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-x64
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash packages/chithram_player/tool/make_fixtures.sh fixtures
      - name: Serve the fixtures
        run: |
          nohup python3 packages/chithram_player/tool/serve.py fixtures 8000 >serve.log 2>&1 &
          sleep 1
          curl -sfI http://127.0.0.1:8000/video.mp4
          curl -sf -H 'Range: bytes=0-9' http://127.0.0.1:8000/audio.m4a | wc -c
      - name: Free disk for the system image
        run: |
          cp app/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
          rm -rf app/build ~/.gradle || true  # Gradle daemon may still write
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash packages/chithram_player/tool/emulator_check.sh ${{ runner.temp }}/app-debug.apk emu-out
      - name: Results to the step summary
        if: always()
        run: |
          { echo '### Android TV emulator (emulator-only figures)'; echo '```'; cat emu-out/summary.txt 2>/dev/null || echo 'no summary'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true  # the repo's Actions artifact quota may be full
        with:
          name: player-emulator
          retention-days: 2
          path: |
            emu-out
            serve.log
          if-no-files-found: ignore

  linux:
    name: Linux under Xvfb (media_kit)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build tools, Xvfb and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv xvfb libgl1-mesa-dri libegl1 libgles2 >/dev/null
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash packages/chithram_player/tool/make_fixtures.sh fixtures
      - name: Serve the fixtures
        run: |
          nohup python3 packages/chithram_player/tool/serve.py fixtures 8000 >serve.log 2>&1 &
          sleep 1
          curl -sfI http://127.0.0.1:8000/video.mp4
      - name: Integration test
        working-directory: app
        env:
          CHITHRAM_MPV_AO: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 300 flutter test integration_test/player_desktop_test.dart -d linux 2>&1 | tee ../linux-test.log
      - name: Results to the step summary
        if: always()
        run: |
          { echo '### Linux under Xvfb (media_kit)'; echo '```'; grep -E 'CHITHRAM_DESKTOP|\+[0-9]|All tests passed|Some tests failed|Error|timeout' linux-test.log 2>/dev/null | tail -30 || echo 'no log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true  # the repo's Actions artifact quota may be full
        with:
          name: player-linux
          retention-days: 2
          path: |
            serve.log
            linux-test.log
          if-no-files-found: ignore
