name: Spike TV shell

on:
  push:
    branches: [spike/tv-shell]
    paths:
      - 'app/lib/src/ui/**'
      - 'app/integration_test/**'
      - 'app/pubspec.yaml'
      - '.github/tv-emulator.sh'
      - '.github/workflows/spike-tv-shell.yml'
  workflow_dispatch:

concurrency:
  group: spike-tv-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Analyze and widget tests (TV and phone size)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Phase 0 widget test
        working-directory: app
        run: flutter test
      - name: Focus, layout and keyboard tests
        working-directory: app
        # flutter test treats anything under integration_test/ as a device test,
        # so the host-run tests are copied next to the normal ones first.
        run: |
          mkdir test/_host
          cp integration_test/host_test.dart integration_test/support.dart test/_host/
          flutter test test/_host

  emulator:
    name: ${{ matrix.name }} emulator
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tv
            image: 'system-images;android-36;android-tv;x86_64'
            device: tv_1080p
          - name: phone
            image: 'system-images;android-34;google_apis;x86_64'
            device: pixel_6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (the TV image does not fit otherwise)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          sudo apt-get clean || true
          df -h /
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache system image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sysimg-${{ matrix.image }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the emulator and run the checks
        env:
          IMAGE: ${{ matrix.image }}
          DEVICE: ${{ matrix.device }}
          NAME: ${{ matrix.name }}
        run: bash .github/tv-emulator.sh out
      - name: Results summary and small screenshots
        if: always()
        run: |
          if command -v mogrify >/dev/null; then
            find out -name '*.png' -exec mogrify -resize '960x>' {} + || true
          fi
          {
            echo "### ${{ matrix.name }} emulator (${{ matrix.image }})"
            echo
            echo '```'
            grep -E '^[0-9:]+ *\+[0-9]+.*(All tests passed|Some tests failed)|\[E\]|\+[0-9]+: |All tests passed|Some tests failed' out/drive.log 2>/dev/null | tail -30 || true
            cat out/cold-start.txt 2>/dev/null || echo 'no cold-start result'
            echo '```'
            echo "Files: $(cd out 2>/dev/null && ls | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: tv-shell-${{ matrix.name }}
          path: out
          retention-days: 2
          if-no-files-found: ignore
