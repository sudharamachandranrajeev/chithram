name: chithram
description: "Chithram: a bring-your-own-sources media app for Android TV, phones and desktop"
publish_to: 'none'
version: 0.2.0+1
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Desktop video (Windows, Linux): libmpv. Android gets its own player later.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1

  # App directories (torrent cache, JSON stores, certificate) and the About page.
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2
  crypto: ^3.0.6

  # Workspace packages. chithram_player must stay listed: Android plugin
  # registration follows the app's declared dependencies only.
  chithram_player:
    path: ../packages/chithram_player
  innertube:
    path: ../packages/innertube
  iptv:
    path: ../packages/iptv
  localsend_rx:
    path: ../packages/localsend_rx
  torrent:
    path: ../packages/torrent
  # Debug-only spike page (see lib/src/spikes/).
  nova_host:
    path: ../packages/nova_host

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests in integration_test/ (TV emulator CI).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Poppins (SIL Open Font License, assets/fonts/OFL.txt).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
