[package]
name = "chithram_torrent"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Chithram torrent engine: librqbit behind a loopback range-streaming HTTP server and a C ABI."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Apache-2.0. rustls instead of native-tls so no OpenSSL is needed on Android.
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
anyhow = "1"
serde_json = "1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
