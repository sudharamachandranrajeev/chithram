name: tdlib
description: "Chithram's Telegram client: TDLib's JSON interface over dart:ffi, a typed client for the few objects the app uses, and a fake for tests."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
